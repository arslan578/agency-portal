# Cloudflare Pages Configuration for Kaivo Frontend
name = "kaivo-frontend"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# This enables Node.js compatibility for Auth.js and other dependencies
# The nodejs_compat flag includes nodejs_compat_v2 when compatibility_date >= 2024-09-23
# This provides polyfills for node:buffer, node:async_hooks, and other Node.js APIs

# Pages-specific configuration for next-on-pages
# next-on-pages writes its bundle to .vercel/output
# Cloudflare Pages should serve from the static subdirectory of that output
pages_build_output_dir = ".vercel/output/static"

# NOTE:
# - Do NOT use build_command / build_config here; they cause warnings and
#   are not needed because Cloudflare already runs
#   `npx @cloudflare/next-on-pages@1` as the build command.

# Environment variables (set these in Cloudflare Pages dashboard)
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# NEXTAUTH_SECRET
# NEXTAUTH_URL
