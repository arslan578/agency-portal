apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
      - env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: DATABASE_URL
              name: kaivo-secrets
        image: kaivo-account-service:latest
        name: account-service
        ports:
        - containerPort: 8000
---
