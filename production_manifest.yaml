---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: nginx
  name: kaivo-ingress
  namespace: production
spec:
  rules:
  - host: getkaivo.com
    http:
      paths:
      - backend:
          service:
            name: frontend
            port:
              number: 80
        path: /
        pathType: Prefix
      - backend:
          service:
            name: auth-service
            port:
              number: 80
        path: /api/auth
        pathType: Prefix
      - backend:
          service:
            name: account-service
            port:
              number: 80
        path: /api/account
        pathType: Prefix
      - backend:
          service:
            name: campaign-service
            port:
              number: 80
        path: /api/campaign
        pathType: Prefix
      - backend:
          service:
            name: creative-service
            port:
              number: 80
        path: /api/creative
        pathType: Prefix
      - backend:
          service:
            name: audience-service
            port:
              number: 80
        path: /api/audience
        pathType: Prefix
      - backend:
          service:
            name: reporting-service
            port:
              number: 80
        path: /api/reporting
        pathType: Prefix
      - backend:
          service:
            name: policy-service
            port:
              number: 80
        path: /api/policy
        pathType: Prefix
      - backend:
          service:
            name: intelligence-service
            port:
              number: 80
        path: /api/intelligence
        pathType: Prefix
      - backend:
          service:
            name: billing-service
            port:
              number: 80
        path: /api/billing
        pathType: Prefix
      - backend:
          service:
            name: agent-service
            port:
              number: 80
        path: /api/agent
        pathType: Prefix
  tls:
  - hosts:
    - getkaivo.com
    secretName: kaivo-tls
