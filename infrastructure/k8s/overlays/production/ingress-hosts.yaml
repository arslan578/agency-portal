          #       port:
          #         number: 80
          
          # Generic fallback for /api/SERVICE style requests
          - path: /api/auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-service
                port:
                  number: 80
          - path: /api/account(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: account-service
                port:
                  number: 80
          - path: /api/campaign(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
