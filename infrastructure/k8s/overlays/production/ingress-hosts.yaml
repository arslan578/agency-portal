apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kaivo-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
    - host: app.getkaivo.com
      http:
        paths:
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend
                port:
                  number: 80

          # --- API Routes (Parity with api.getkaivo.com) ---
          # Disabled to prevent collision with Frontend UI routes (e.g. /auth/signin, /account, /reporting)
          # API consumers should use /api/* or api.getkaivo.com
          
          # - path: /auth(/|$)(.*)
          #   pathType: ImplementationSpecific
          #   backend:
          #     service:
          #       name: auth-service
          #       port:
          #         number: 80
