                port:
                  number: 80
          - path: /api/audience(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: audience-service
                port:
                  number: 80
          - path: /api/i18n(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: i18n-service
                port:
                  number: 80
          # Capabilities (API Gateway)
          # Capabilities (API Gateway)
          # Use /()(capabilities.*) to preserve /capabilities in the rewrite target /$2
          - path: /()(capabilities.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
          - path: /api/capabilities(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
    - host: agency.getkaivo.com
      http:
        paths:
          # Agency Portal (all routes, including NextAuth /api/auth/*, must go to agency-portal)
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: agency-portal
                port:
                  number: 80
