# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "e50f133e1b75bea26f2e1c1d7f6d8482"
name = "Kaivo"
application_url = "https://app.getkaivo.com/integrations/shopify"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  uri = "https://app.getkaivo.com/api/proxy/integrations/shopify/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://app.getkaivo.com/api/proxy/integrations/shopify/webhooks/app/uninstalled"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# V1 review build: read_products only (no write_products)
scopes = "read_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://app.getkaivo.com/api/proxy/integrations/shopify/auth/callback"
]
