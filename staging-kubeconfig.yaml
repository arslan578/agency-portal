# Example kubeconfig layout — DO NOT put real tokens in git.
# Generate a real file locally (never commit it):
#   doctl kubernetes cluster kubeconfig save <cluster-name>
#   # or: terraform output -raw kube_config > staging-kubeconfig.yaml
#
# Add staging-kubeconfig.yaml to your machine only; use CI secrets (e.g. KUBE_CONFIG) in pipelines.
apiVersion: v1
clusters:
  - cluster:
      certificate-authority-data: BASE64_CA_FROM_doctl_OR_terraform_output
      server: https://YOUR_CLUSTER_UUID.k8s.ondigitalocean.com
    name: your-cluster-context
contexts:
  - context:
      cluster: your-cluster-context
      user: your-cluster-admin
    name: your-cluster-context
current-context: your-cluster-context
kind: Config
preferences: {}
users:
  - name: your-cluster-admin
    user:
      token: YOUR_DIGITALOCEAN_API_TOKEN
